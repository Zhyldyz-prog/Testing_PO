
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ blog.title }}</title>
</head>
<body>
    <h1>{{ blog.title }}</h1>

    <p>{{ blog.description }}</p>
    <p>Автор: {{ blog.author }}</p>
    <p>Количество просмотров: {{ blog.views }}</p>
    <p>Создано: {{ blog.created_at }}</p>
    <p>Обновлено: {{ blog.updated_at }}</p>

    <a href="{% url 'blog_list' %}">Назад к списку статей</a>
</body>
</html>
