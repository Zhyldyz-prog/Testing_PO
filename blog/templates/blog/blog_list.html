
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список статей</title>
</head>
<body>
    <h1>Список статей блога</h1>

    {% for item in blogs %}
        <article>
            <h2>{{ item.title }}</h2>
            <p>{{ item.description }}</p>
            <p>Автор: {{ item.author }}</p>
            <p>Просмотры: {{ item.views }}</p>

            <a href="{% url 'blog_detail' item.id %}">
                Подробнее
            </a>
        </article>
        <hr>
    {% empty %}
        <p>Пока статей нет.</p>
    {% endfor %}
</body>
</html>
